[project]
name = "parlay"
version = "0.2.0"
description = "Telegram music, shared listening rooms, and opt-in Compass recommendations."
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36,<2",
    "py-tgcalls>=2.3,<3",
    "ntgcalls>=2.2,<3",
    "google-genai>=0.3",
    "yt-dlp>=2025.5.22",
    "bgutil-ytdlp-pot-provider>=1.3.2,<2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27,<1",
]

[project.scripts]
parlay = "parlay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["parlay"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
