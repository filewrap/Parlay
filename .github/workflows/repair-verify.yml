name: Repair verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -e '.[dev]' -q
      - name: Apply cancellation and generation fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/parlay/app.py')
          s = p.read_text()
          old = '            except Exception:\n                log.exception("Could not connect media transport for chat %s", chat_id)'
          new = '''            except asyncio.CancelledError:
                          await self._close_call()
                          await bridge.stop()
                          raise
                      except Exception:
                          log.exception("Could not connect media transport for chat %s", chat_id)'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('await self._on_activity_unavailable(chat_id, reason)\n', 'await self._on_activity_unavailable(chat_id, reason, expected_session=session)\n', 1)
          old = '    async def _on_activity_unavailable(self, chat_id: int, reason: str) -> None:'
          new = '''    async def _on_activity_unavailable(
                  self, chat_id: int, reason: str, *, expected_session: Any = None,
              ) -> None:'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '        async with self._media_lock:\n            if chat_id != self._media_chat_id:\n                return\n            if reason == "media_revoked":'
          new = '''        async with self._media_lock:
                      if chat_id != self._media_chat_id:
                          return
                      if expected_session is not None and self.sessions.session is not expected_session:
                          return
                      if reason == "media_revoked":'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          p = Path('src/parlay/audio/bridge.py')
          s = p.read_text()
          old = '        await self._adapter.start(chat)\n        self._active = True'
          new = '''        try:
                      await self._adapter.start(chat)
                  except BaseException:
                      try:
                          await self._adapter.stop()
                      finally:
                          await self._capture.stop()
                          self._playback.clear()
                      raise
                  self._active = True'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          p = Path('src/parlay/audio/rawcall.py')
          s = p.read_text()
          old = '        app.add_handler(self._handle_update)\n        await app.play('
          new = '        app.add_handler(self._handle_update)\n        self._app = app  # Keep cleanup possible if play/record fails or is cancelled.\n        await app.play('
          assert old in s
          p.write_text(s.replace(old, new, 1))
          p = Path('tests/test_app_commands.py')
          s = p.read_text().replace('from types import SimpleNamespace', 'import asyncio\nfrom types import SimpleNamespace', 1)
          s += '''

          @pytest.mark.asyncio
          async def test_raw_callback_returns_while_media_lock_held(app):
              app.vc.resolve = AsyncMock(return_value=channel())
              await app._cmd_join(ParsedCommand("join", "@music", "7"))
              app._notify_operator = AsyncMock()
              async with app._media_lock:
                  await asyncio.wait_for(
                      app._queue_activity_unavailable(app._media_chat_id, "call_discarded"), 0.2
                  )
                  await asyncio.sleep(0)
                  assert app.sessions.active
              await asyncio.gather(*tuple(app._activity_jobs))
              assert not app.sessions.active


          @pytest.mark.asyncio
          async def test_old_queued_callback_cannot_close_rejoined_session(app):
              app.vc.resolve = AsyncMock(return_value=channel())
              await app._cmd_join(ParsedCommand("join", "@music", "7"))
              chat_id = app._media_chat_id
              async with app._media_lock:
                  await app._queue_activity_unavailable(chat_id, "call_discarded")
                  await asyncio.sleep(0)
                  app.sessions.end()
                  app.sessions.begin_join(str(chat_id))
                  app.sessions.mark_connected()
              await asyncio.gather(*tuple(app._activity_jobs))
              assert app.sessions.active


          @pytest.mark.asyncio
          async def test_cancelled_join_rolls_back(app, monkeypatch):
              app.vc.resolve = AsyncMock(return_value=channel())
              bridge = Mock(start=AsyncMock(side_effect=asyncio.CancelledError()), stop=AsyncMock())
              monkeypatch.setattr("parlay.app.RawAudioBridge", lambda *a, **kw: bridge)
              with pytest.raises(asyncio.CancelledError):
                  await app._cmd_join(ParsedCommand("join", "@music", "7"))
              assert not app.sessions.active
              assert app._media_chat_id is None
              bridge.stop.assert_awaited()
          '''
          p.write_text(s)
          PY
      - name: Format and commit
        run: |
          ruff check --fix src/parlay/app.py src/parlay/audio/bridge.py src/parlay/audio/rawcall.py tests/test_app_commands.py
          ruff format src/parlay/app.py src/parlay/audio/bridge.py src/parlay/audio/rawcall.py tests/test_app_commands.py
          git config user.name 'kei'
          git config user.email 'xkailashhh@gmail.com'
          git add src/parlay/app.py src/parlay/audio/bridge.py src/parlay/audio/rawcall.py tests/test_app_commands.py
          git diff --cached --quiet || git commit -m 'fix: roll back cancelled joins and reject stale cleanup callbacks'
          git push origin HEAD:main
      - name: Verify all code
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest -q
