name: Rooms callback scoped commit
on:
  push:
    paths: [.github/workflows/rooms-action-callback-commit.yml]
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply prior verified patch and commit
        run: |
          awk '/python - <<'"'"'PY'"'"'/{found=1; next} found && /^          PY$/{exit} found{sub(/^          /, ""); print}' .github/workflows/rooms-action-callback.yml > /tmp/patch.py
          python /tmp/patch.py
          git config user.name "Alex C11"
          git config user.email "alex.c992954@gmail.com"
          git rm .github/workflows/rooms-action-callback.yml .github/workflows/rooms-action-callback-commit.yml
          git add src/parlay/rooms/service.py tests/test_rooms_service.py
          git commit -m "feat(rooms): emit idempotent playback action events"
          git push
