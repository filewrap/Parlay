name: Rooms integration regression diagnostic

on:
  push:
    paths:
      - .github/workflows/rooms-authority-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -e '.[dev]' -q
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/rooms-authority-final.yml').read_text()
          script = workflow.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script, 'patch', 'exec'))
          PY
          ruff check --fix src/parlay/rooms/service.py tests/test_rooms_service.py >/dev/null
          ruff format src/parlay/rooms/service.py tests/test_rooms_service.py >/dev/null
          pytest -q tests/test_rooms_gateway.py --maxfail=1
