name: Signed call identifier fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/signed-call-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]' -q
      - name: Correct signed call identifier validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/parlay/runtime.py')
          s = p.read_text()
          old = '        if isinstance(call_id, bool) or not isinstance(call_id, int) or call_id <= 0:\n            raise ValueError("call_id must be a positive Telegram call identifier")'
          new = '''        # Telegram InputGroupCall.id is a signed 64-bit TL long. Preserve its sign.
                  if (
                      isinstance(call_id, bool)
                      or not isinstance(call_id, int)
                      or call_id == 0
                      or not -(2**63) <= call_id < 2**63
                  ):
                      raise ValueError("call_id must be a nonzero signed 64-bit Telegram call identifier")'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          p = Path('docs/runtime.md')
          s = p.read_text()
          s = s.replace('actual positive Telegram `InputGroupCall.id`.', 'actual signed 64-bit Telegram `InputGroupCall.id`, preserving negative values.')
          s = s.replace('`parlay.runtime` is an integration-ready subsystem. `ParlayApp` does not use it yet.', '`ParlayApp` uses `parlay.runtime` for independent per-chat media sessions.')
          p.write_text(s)
          PY
          ruff format src/parlay/runtime.py tests/test_signed_call_id.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - name: Commit verified correction
        run: |
          git config user.name 'kei'
          git config user.email 'xkailashhh@gmail.com'
          git add src/parlay/runtime.py docs/runtime.md tests/test_signed_call_id.py
          git commit -m 'fix: accept signed Telegram group call IDs without changing their value'
          git push origin HEAD:main
