name: Frontend verify 7f31
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build static export
        env:
          NEXT_PUBLIC_BACKEND_URL: https://backend.example.test
        run: npm run build
      - name: Commit generated lockfile
        working-directory: .
        run: |
          if git diff --quiet -- web/package-lock.json; then exit 0; fi
          git config user.name "Alex C11"
          git config user.email "alex.c992954@gmail.com"
          git add web/package-lock.json
          git commit -m "chore(web): add verified npm lockfile"
          git push
