name: Rooms quality
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install -e . 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' httpx websockets pytest pytest-asyncio ruff mypy
      - name: Correct moderator boundary scenario
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_rooms_service.py'); text=path.read_text()
          start=text.index('@pytest.mark.asyncio\nasync def test_moderator_cannot_kick_another_moderator')
          replacement='''@pytest.mark.asyncio\nasync def test_moderator_cannot_kick_a_moderator(tmp_path):\n    service = RoomService(tmp_path / "rooms.db")\n    room = await service.create_personal(1, 2)\n    room = await service.join(room["id"], user(2))\n    room = await service.action(\n        room["id"], 1, "mod-2", room["revision"], "moderator", {"user_id": 2, "enabled": True}\n    )\n    with pytest.raises(RoomError, match="cannot be removed"):\n        await service.action(room["id"], 2, "kick-2", room["revision"], "kick", {"user_id": 2})\n'''
          path.write_text(text[:start]+replacement)
          PY
          ruff format tests/test_rooms_service.py
          ruff check tests/test_rooms_service.py
          git config user.name 'Alex C11'
          git config user.email 'alex.c992954@gmail.com'
          git add tests/test_rooms_service.py
          git commit -m 'test(rooms): cover moderator self-protection boundary'
          git pull --rebase origin main
          git push origin HEAD:main
      - run: ruff format --check src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
      - run: ruff check src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
      - run: mypy src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
      - run: pytest -q tests/test_rooms_service.py tests/test_rooms_gateway.py
