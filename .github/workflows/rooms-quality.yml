name: Rooms quality
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install -e . 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' httpx websockets pytest pytest-asyncio ruff mypy
      - name: Verify and capture result
        run: |
          set +e
          {
            ruff format --check src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
            ruff check src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
            mypy src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
            pytest -q --tb=short tests/test_rooms_service.py tests/test_rooms_gateway.py
          } > .github/rooms-test-output.txt 2>&1
          status=$?
          cat .github/rooms-test-output.txt
          git config user.name 'Alex C11'
          git config user.email 'alex.c992954@gmail.com'
          git add .github/rooms-test-output.txt
          git commit -m 'test(rooms): capture verification diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
          exit $status
