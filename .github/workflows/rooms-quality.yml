name: Rooms quality
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install -e . 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' httpx websockets pytest pytest-asyncio ruff mypy
      - name: Apply scoped mypy fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/parlay/rooms/service.py'); text=path.read_text()
          old='''        if notify and self.on_reentry:\n            result = self.on_reentry(*notify)\n            if inspect.isawaitable(result):\n                await result'''
          new='''        if notify and self.on_reentry:\n            reentry_result = self.on_reentry(*notify)\n            if inspect.isawaitable(reentry_result):\n                await reentry_result'''
          assert text.count(old)==1; path.write_text(text.replace(old,new))
          path=Path('src/parlay/rooms/gateway.py'); text=path.read_text()
          old='''    x, z, rotation = (float(value) for value in values)'''
          new='''    x, z, rotation = (float(cast(int | float, value)) for value in values)'''
          assert text.count(old)==1; path.write_text(text.replace(old,new))
          path=Path('tests/test_rooms_gateway.py'); text=path.read_text()
          text=text.replace('from typing import Any','from typing import Any, cast')
          text=text.replace('origin=ORIGIN','origin=cast(Any, ORIGIN)')
          path.write_text(text)
          PY
          ruff check --fix src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
          ruff format src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
      - run: ruff format --check src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
      - run: ruff check src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
      - run: mypy src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
      - run: pytest -q tests/test_rooms_service.py tests/test_rooms_gateway.py
      - name: Commit scoped fixes
        if: always()
        run: |
          if ! git diff --quiet; then
            git config user.name 'Alex C11'
            git config user.email 'alex.c992954@gmail.com'
            git add src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
            git commit -m 'fix(rooms): satisfy scoped static checks'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
