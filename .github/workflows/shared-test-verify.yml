name: shared-test-verify
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shared-test-verify.yml']
permissions:
  contents: read
jobs:
  shared-test-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -e '.[dev]' -q
      - name: Verify scoped shared integration test
        run: |
          ruff check tests/test_shared_integration.py
          ruff format --check tests/test_shared_integration.py
          pytest -q tests/test_shared_integration.py
