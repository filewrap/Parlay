name: YouTube configuration repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/youtube-config-fix.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply configuration corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert old in s, (path, old)
              p.write_text(s.replace(old, new, 1))
          patch('pyproject.toml', '    "yt-dlp>=2024.8.6",', '    "yt-dlp>=2025.5.22",\n    "bgutil-ytdlp-pot-provider>=1.3.2,<2",')
          patch('src/parlay/media/po_token.py', 'def extractor_args(self) -> dict[str, list[str]]:', 'def extractor_args(self) -> dict[str, dict[str, list[str]]]:')
          patch('src/parlay/media/po_token.py', 'return {_PLUGIN_ARG_KEY: [f"base_url={self._base_url}"]}', 'return {_PLUGIN_ARG_KEY: {"base_url": [self._base_url]}}')
          patch('src/parlay/media/po_token.py', 'YouTube blocks server-side requests that lack a proof-of-origin (PO) token, and\ncookie auth gets accounts banned.', 'YouTube may require proof-of-origin (PO) tokens for media requests. Tokens do not\nguarantee access, and account-cookie use can carry account restrictions.')
          patch('src/parlay/media/source_selector.py', '    def _ydl_opts(self, source: MediaSource) -> dict[str, Any]:', '    def youtube_options(self) -> dict[str, Any]:\n        """Fresh shared options for metadata, search, and stream extraction."""\n        return self._ydl_opts(MediaSource.YOUTUBE)\n\n    def _ydl_opts(self, source: MediaSource) -> dict[str, Any]:')
          patch('src/parlay/media/source_selector.py', '            "format": "bestaudio/best",', '            "format": "bestaudio/best",\n            "socket_timeout": 10,\n            "retries": 1,\n            "extractor_retries": 1,')
          patch('src/parlay/media/resolver.py', 'from .track import StreamSource, Track, TrackNotFoundError', 'from .track import SourceResolutionError, StreamSource, Track, TrackNotFoundError')
          patch('src/parlay/media/resolver.py', '        info = await asyncio.to_thread(self._probe, target)', '        from yt_dlp.utils import DownloadError\n\n        try:\n            info = await asyncio.to_thread(self._probe, target)\n        except DownloadError as exc:\n            raise SourceResolutionError(\n                "YouTube metadata is unavailable or access was blocked. "\n                "Check the media provider logs before retrying."\n            ) from exc')
          patch('src/parlay/media/resolver.py', '    @staticmethod\n    def _probe(target: str)', '    def _probe(self, target: str)')
          patch('src/parlay/media/resolver.py', '        opts = {"quiet": True, "no_warnings": True, "skip_download": True}', '        opts = self._selector.youtube_options()\n        opts["noplaylist"] = True')
          patch('src/parlay/search.py', 'from .rooms.service import RoomError', 'from .media.po_token import PoTokenProvider\nfrom .media.source_selector import SourceSelector\nfrom .rooms.service import RoomError')
          patch('src/parlay/search.py', '    def __init__(self) -> None:', '    def __init__(self, pot_provider_url: str = "http://127.0.0.1:4416") -> None:\n        self._selector = SourceSelector(PoTokenProvider(pot_provider_url))')
          patch('src/parlay/search.py', '    @staticmethod\n    def _probe(target: str)', '    def _probe(self, target: str)')
          patch('src/parlay/search.py', '        options = {', '        options = {\n            **self._selector.youtube_options(),')
          patch('src/parlay/app.py', 'self.search = MediaSearch()', 'self.search = MediaSearch(config.pot_provider_url)')
          patch('src/parlay/command_wrapper.py', 'from .commands import CommandHandler', 'from .commands import CommandHandler\nfrom .media.track import MediaError')
          patch('src/parlay/command_wrapper.py', '            except RPCError:', '            except MediaError:\n                log.warning("Media resolution or playback failed", exc_info=True)\n                reply = fmt.error("The media source could not provide this track. "\n                                  "It may be blocked or unavailable. Check the provider logs.")\n            except RPCError:')
          p = Path('tests/test_media_sourcing.py')
          s = p.read_text().replace('dict[str, list[str]]', 'dict[str, dict[str, list[str]]]')
          s = s.replace('{"youtubepot-bgutilhttp": ["base_url=http://prov:4416"]}', '{"youtubepot-bgutilhttp": {"base_url": ["http://prov:4416"]}}')
          p.write_text(s)
          PY
      - run: pip install -e '.[dev]' -q
      - run: ruff check --fix src/parlay/media src/parlay/search.py src/parlay/app.py src/parlay/command_wrapper.py tests/test_media_sourcing.py tests/test_youtube_options.py
      - run: ruff format src/parlay/media src/parlay/search.py src/parlay/app.py src/parlay/command_wrapper.py tests/test_media_sourcing.py tests/test_youtube_options.py
      - run: ruff check . && ruff format --check . && mypy && pytest -q
      - name: Commit verified changes
        run: |
          git config user.name 'kei'
          git config user.email 'xkailashhh@gmail.com'
          git add pyproject.toml src/parlay/media src/parlay/search.py src/parlay/app.py src/parlay/command_wrapper.py tests/test_media_sourcing.py tests/test_youtube_options.py
          git commit -m 'fix: apply installed PO-token provider to metadata search and stream extraction'
          git push origin HEAD:main
