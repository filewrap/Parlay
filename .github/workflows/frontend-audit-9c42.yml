name: Frontend audit 9c42
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused room client fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/components/room-app.tsx')
          s = p.read_text()
          replacements = {
            'import { ApiError, authenticate, backendUrl, client, roomCandidate, websocketUrl } from "@/lib/api";': 'import { ApiError, authenticate, backendUrl, client, quietHour, roomCandidate, websocketUrl } from "@/lib/api";',
            'import { expiryFromDuration, formatTime, authoritativePosition } from "@/lib/timeline";': 'import { formatTime, authoritativePosition } from "@/lib/timeline";',
            'const avatars = ["round", "tall", "soft"]; const outfits = ["violet", "coral", "mint", "gold"]; const themes = ["midnight", "sunset", "forest"];': 'const avatars = ["round", "tall", "soft"]; const outfits = ["violet", "coral", "mint", "gold"]; const themes = ["default", "midnight", "sunset", "forest"];',
            'const ownId = String(auth?.user.user_id ?? auth?.user.id ?? "");': 'const ownId = String(auth?.user.id ?? "");',
            'if (e instanceof ApiError && e.status === 409) { setError("The room changed. The latest snapshot is shown. Review and try again."); try { setSnapshot(await api.snapshot(roomId)); } catch {} }': 'if (e instanceof ApiError && e.status === 409) { setError("The room changed. The latest snapshot is shown. Review and try again."); if (e.snapshot) setSnapshot(e.snapshot); else try { setSnapshot(await api.snapshot(roomId)); } catch {} }',
            'quiet_start: quiet.start, quiet_end: quiet.end,': 'quiet_start: quietHour(quiet.start), quiet_end: quietHour(quiet.end),',
            'onClick={() => act("appearance", { avatar: value, outfit: me?.outfit || outfits[0] })}': 'onClick={() => act("appearance", { avatar: value })}',
            'onClick={() => act("appearance", { avatar: me?.avatar || avatars[0], outfit: value })}': 'onClick={() => act("appearance", { outfit: value })}',
            '  const preview = snapshot.kind === "personal" ? expiryFromDuration(form.duration) : null;\n': '',
            'New password (leave blank to keep disabled/unchanged)': 'New password (leave blank to disable password protection)',
            '<div className="mt-3 rounded-xl border border-violet-300/15 bg-violet-300/10 p-3 text-xs"><strong className="block text-violet-200">Expiry preview</strong><span className="mt-1 block text-white/65">Saving will set expiry to {preview?.toLocaleString()}.</span></div>': '<div className="mt-3 rounded-xl border border-violet-300/15 bg-violet-300/10 p-3 text-xs text-white/65">Lifetime is measured from room creation. The saved expiry shown by the room is authoritative.</div>'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected source: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install reviewed dependency patches
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts
      - name: Clean install
        working-directory: web
        run: npm ci
      - name: Full audit
        working-directory: web
        run: npm audit --json | tee audit.json
      - name: Production audit
        working-directory: web
        run: npm audit --omit=dev --json | tee audit-production.json
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Static production build
        working-directory: web
        env:
          NEXT_PUBLIC_BACKEND_URL: https://rooms.example.com
        run: npm run build
      - name: Commit generated lockfile and client fixes
        run: |
          rm -f web/audit.json web/audit-production.json
          git checkout -- web/next-env.d.ts
          git config user.name "Alex C11"
          git config user.email "alex.c992954@gmail.com"
          git add web/components/room-app.tsx web/package-lock.json
          git diff --cached --quiet || git commit -m "fix(web): complete secure room contract alignment"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
