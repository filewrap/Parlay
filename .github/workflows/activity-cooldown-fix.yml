name: Activity discovery cooldown helper

'on':
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add discovery cooldown
        run: python -c "from pathlib import Path; p=Path('src/parlay/activity.py'); a=p.read_text().splitlines(); i=next(i for i,x in enumerate(a) if 'self._discovery_task:' in x); a.insert(i+1,'        self._last_discovery_at = 0.0'); j=next(i for i,x in enumerate(a) if x.strip() == 'def _schedule_discovery(self) -> None:'); k=next(i for i in range(j,j+8) if a[i].strip() == 'return'); a[k+1:k+1]=['        now = time.monotonic()','        if now - self._last_discovery_at < 0.1:','            return','        self._last_discovery_at = now']; p.write_text('\\n'.join(a)+'\\n')"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff>=0.6' -q
      - run: ruff format src/parlay/activity.py tests/test_activity.py
      - run: ruff check src/parlay/activity.py tests/test_activity.py
      - name: Commit owned file
        run: git config user.name 'Alex C11' && git config user.email 'alex.c992954@gmail.com' && git add src/parlay/activity.py tests/test_activity.py && git commit -m 'Bound repeated activity discovery' && git push
