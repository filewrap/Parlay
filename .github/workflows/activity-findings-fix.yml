name: Activity findings fix

'on':
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' -q
      - run: ruff check src/parlay/activity.py tests/test_activity.py
      - run: ruff format --check src/parlay/activity.py tests/test_activity.py
      - run: mypy src/parlay/activity.py
      - run: pytest -q tests/test_activity.py
