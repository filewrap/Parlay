name: Activity final fix

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/activity_final_fix.py
      - run: python -m pip install -e '.[dev]' -q
      - run: ruff format src/parlay/activity.py tests/test_activity.py
      - run: ruff check src/parlay/activity.py tests/test_activity.py
      - run: mypy src/parlay/activity.py
      - run: pytest -q tests/test_activity.py
      - name: Commit owned files
        run: git config user.name 'Alex C11' && git config user.email 'alex.c992954@gmail.com' && git add src/parlay/activity.py tests/test_activity.py && git commit -m 'Finalize activity bootstrap recovery' && git push
