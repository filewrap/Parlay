name: Rooms critical verification
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install -e . 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' httpx websockets pytest pytest-asyncio ruff mypy
      - name: Apply critical fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/parlay/rooms/gateway.py'); text=path.read_text()
          old='''    supplied = values.pop("hash", None)\n    values.pop("signature", None)'''
          new='''    supplied = values.pop("hash", None)'''
          assert text.count(old)==1; text=text.replace(old,new)
          old='''        if inspect.iscoroutinefunction(method):\n            return await method(*args)\n        return await asyncio.to_thread(method, *args)'''
          new='''        try:\n            if inspect.iscoroutinefunction(method):\n                return await method(*args)\n            return await asyncio.to_thread(method, *args)\n        except ValueError as error:\n            raise HTTPException(400, str(error)) from error'''
          assert text.count(old)==1; path.write_text(text.replace(old,new))

          path=Path('src/parlay/rooms/service.py'); text=path.read_text()
          old='''            if row["revision"] != expected_revision:\n                raise RoomError(\n                    "stale_revision",\n                    "Room state changed. Refresh and retry.",\n                    409,\n                    self._snapshot(row, user_id),\n                )\n            changed, notify, playback_call = await self._apply(\n                row, data, member, action, payload, resolved\n            )\n            revision = row["revision"] + (1 if changed else 0)\n            new_row = self._replace(row, revision, data)\n            output = self._snapshot(new_row, user_id)'''
          new='''            reentry_request = action == "request_reentry" and user_id in data["kicked"]\n            if not reentry_request and row["revision"] != expected_revision:\n                raise RoomError(\n                    "stale_revision",\n                    "Room state changed. Refresh and retry.",\n                    409,\n                    self._snapshot(row, user_id),\n                )\n            changed, notify, playback_call = await self._apply(\n                row, data, member, action, payload, resolved\n            )\n            revision = row["revision"] + (1 if changed else 0)\n            new_row = self._replace(row, revision, data)\n            if reentry_request:\n                output = {"status": "pending"}\n                publish_output = self._snapshot(new_row, row["owner_id"])\n            else:\n                output = self._snapshot(new_row, user_id)\n                publish_output = output'''
          assert text.count(old)==1; text=text.replace(old,new)
          old='''        self._publish(room_id, output)\n        return output'''
          new='''        self._publish(room_id, publish_output)\n        return output'''
          assert text.count(old)==1; text=text.replace(old,new)
          old='''            if row["kind"] == "group":\n                playback_call = (row["chat_id"], action, {"track": resolved})'''
          new='''            if row["kind"] == "group":\n                runtime_action = "play" if action == "queue_add" else "force_play"\n                runtime_payload = (\n                    {"queue": [resolved["source_url"]]}\n                    if runtime_action == "play"\n                    else {"request": resolved["source_url"]}\n                )\n                playback_call = (row["chat_id"], runtime_action, runtime_payload)'''
          assert text.count(old)==1; text=text.replace(old,new)
          old='''        url = track.get("source_url", "")\n        if not isinstance(url, str) or not (\n            url.startswith("https://www.youtube.com/") or url.startswith("https://youtu.be/")\n        ):\n            raise RoomError("unsupported_source", "Only HTTPS YouTube page URLs are supported")'''
          new='''        url = track.get("source_url", "")\n        parsed = urlsplit(url) if isinstance(url, str) else None\n        if (\n            parsed is None\n            or parsed.scheme != "https"\n            or parsed.hostname not in {"www.youtube.com", "youtube.com", "youtu.be"}\n            or parsed.username is not None\n            or parsed.password is not None\n            or parsed.port not in {None, 443}\n        ):\n            raise RoomError("unsupported_source", "Only HTTPS YouTube page URLs are supported")'''
          assert text.count(old)==1; text=text.replace(old,new)
          text=text.replace('from urllib.parse import', 'from urllib.parse import') if 'from urllib.parse import' in text else text
          if 'from urllib.parse import urlsplit' not in text:
              marker='import uuid\n'
              assert marker in text
              text=text.replace(marker, marker+'from urllib.parse import urlsplit\n')
          path.write_text(text)

          path=Path('tests/test_rooms_gateway.py'); text=path.read_text()
          old='''    check = "\\n".join(f"{key}={value}" for key, value in sorted(values.items()))'''
          new='''    check = "\\n".join(f"{key}={value}" for key, value in sorted(values.items()))'''
          # helper already signs every supplied field, including modern signature.
          assert old in text
          old_test='''    assert validate_init_data(signed(), TOKEN)["user"]["id"] == 1\n    with pytest.raises(ValueError, match="signature"):'''
          new_test='''    assert validate_init_data(signed(), TOKEN)["user"]["id"] == 1\n    modern = signed(extra={"signature": "modern-ed25519-signature"})\n    assert validate_init_data(modern, TOKEN)["user"]["id"] == 1\n    with pytest.raises(ValueError, match="signature"):\n        validate_init_data(modern.replace("modern-ed25519-signature", "tampered"), TOKEN)\n    with pytest.raises(ValueError, match="signature"):'''
          assert text.count(old_test)==1; text=text.replace(old_test,new_test)
          duplicate_line='''    duplicate = signed() + "&auth_date=1"\n    with pytest.raises(ValueError, match="duplicate"):\n        validate_init_data(duplicate, TOKEN)'''
          duplicate_new='''    duplicate = signed() + "&auth_date=1"\n    with pytest.raises(ValueError, match="duplicate"):\n        validate_init_data(duplicate, TOKEN)\n    duplicate_signature = modern + "&signature=other"\n    with pytest.raises(ValueError, match="duplicate"):\n        validate_init_data(duplicate_signature, TOKEN)\n    invalid_user = signed(extra={"user": "[]"})\n    with pytest.raises(ValueError, match="Telegram user"):\n        validate_init_data(invalid_user, TOKEN)'''
          assert text.count(duplicate_line)==1; text=text.replace(duplicate_line,duplicate_new)
          old='''                "expected_revision": kicked.json()["revision"],\n                "action": "request_reentry",'''
          new='''                "expected_revision": 0,\n                "action": "request_reentry",'''
          assert text.count(old)==1; text=text.replace(old,new)
          old='''        assert request.status_code == 200\n        assert request.json()["pending_reentry"] == []'''
          new='''        assert request.status_code == 200\n        assert request.json() == {"status": "pending"}\n        denied = await client.get(f"/api/rooms/{room['id']}", headers=second)\n        assert denied.status_code == 403'''
          assert text.count(old)==1; text=text.replace(old,new)
          # Compass ValueError becomes a client error.
          old='''        assert calls == [("recommend", ("2",))]\n        oversized = await client.post('''
          new='''        assert calls == [("recommend", ("2",))]\n        def invalid_preferences(*_args: Any) -> None:\n            raise ValueError("invalid preference window")\n\n        app.state.rooms.compass.set_preferences = invalid_preferences\n        invalid = await client.post(\n            "/api/compass/preferences",\n            headers=second,\n            json={\n                "enabled": True,\n                "count": 2,\n                "quiet_start": "bad",\n                "quiet_end": "bad",\n                "timezone": "UTC",\n            },\n        )\n        assert invalid.status_code == 400\n        oversized = await client.post('''
          assert text.count(old)==1; path.write_text(text.replace(old,new))

          path=Path('tests/test_rooms_service.py'); text=path.read_text()
          old='''    room = await service.action(room["id"], 2, "request", room["revision"], "request_reentry", {})\n    assert notices and room["pending_reentry"] == []'''
          new='''    room = await service.action(room["id"], 2, "request", 0, "request_reentry", {})\n    assert notices and room == {"status": "pending"}\n    with pytest.raises(RoomError, match="access"):\n        await service.snapshot(room_id, 2)'''
          # Preserve room id before replacing response.
          assert text.count(old)==1
          text=text.replace('''    room = await service.action(room["id"], 1, "kick", room["revision"], "kick", {"user_id": 2})\n    with pytest.raises(RoomError, match="approve"):\n        await service.join(room["id"], user(2), "secret")''','''    room = await service.action(room["id"], 1, "kick", room["revision"], "kick", {"user_id": 2})\n    room_id = room["id"]\n    with pytest.raises(RoomError, match="approve"):\n        await service.join(room_id, user(2), "secret")''')
          text=text.replace(old,new)
          text=text.replace('''    owner = await service.snapshot(room["id"], 1)''','''    owner = await service.snapshot(room_id, 1)''',1)
          text=text.replace('''        room["id"], 1, "approve"''','''        room_id, 1, "approve"''',1)
          text=text.replace('''    joined = await service.join(room["id"], user(2), "secret")''','''    joined = await service.join(room_id, user(2), "secret")''',1)
          text=text.replace('''    owner = await service.snapshot(room["id"], 1)''','''    owner = await service.snapshot(room_id, 1)''',1)
          text=text.replace('''        room["id"], 1, "play"''','''        room_id, 1, "play"''',3)
          text += '''\n\n@pytest.mark.asyncio\nasync def test_group_queue_maps_to_runtime_play_and_safe_source(tmp_path):\n    calls = []\n\n    async def playback(chat_id, action, payload):\n        calls.append((chat_id, action, payload))\n\n    service = RoomService(\n        tmp_path / "rooms.db",\n        playback=playback,\n        authority=lambda *_: True,\n        member=lambda *_: True,\n        search=search,\n    )\n    room = await service.ensure_group(100, 1, 9)\n    await service.action(room["id"], 9, "queue", room["revision"], "queue_add", {"query": "x"})\n    assert calls == [(100, "play", {"queue": [TRACK["source_url"]]})]\n    with pytest.raises(RoomError, match="YouTube"):\n        service._clean_track({"id": "x", "title": "x", "source_url": "https://youtu.be.evil/x"})\n\n\ndef test_owner_reserves_one_default_capacity_slot(tmp_path):\n    service = RoomService(tmp_path / "rooms.db")\n    data = service._new_data(1)\n    assert data["settings"]["capacity"] == 2\n    assert len(data["members"]) == 1\n    assert data["members"][0]["role"] == "owner"\n'''
          path.write_text(text)

          path=Path('docs/rooms-api.md'); text=path.read_text()
          old='''`playback(chat_id, action, payload)` is async and can return the current playback snapshot.'''
          new='''`playback(chat_id, action, payload)` is async and can return the current playback snapshot. Group `queue_add` maps to runtime `play` with `{\"queue\": [source_url]}`. Group `force_play` maps to runtime `force_play` with `{\"request\": source_url}`.'''
          assert text.count(old)==1
          old2='''`request_reentry` must remain reachable after a kick. The gateway therefore needs parent/frontend handling that submits this action before normal admitted WebSocket access is restored.'''
          new2='''`request_reentry` must remain reachable after a kick. An authenticated excluded user submits it with `expected_revision: 0`; the revision check is bypassed only for this action and the response is only `{\"status\":\"pending\"}`. Normal room snapshots and WebSocket admission remain denied. The parent frontend must support this flow before normal admitted WebSocket access is restored.'''
          assert text.count(old2)==1
          path.write_text(text.replace(old,new).replace(old2,new2))
          PY
          ruff check --fix src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
          ruff format src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
          git config user.name 'Alex C11'
          git config user.email 'alex.c992954@gmail.com'
          git add src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py docs/rooms-api.md
          git commit -m 'fix(rooms): secure modern auth and excluded reentry'
          git pull --rebase origin main
          git push origin HEAD:main
      - run: ruff format --check src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
      - run: ruff check src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
      - run: mypy src/parlay/rooms tests/test_rooms_service.py tests/test_rooms_gateway.py
      - run: pytest -q tests/test_rooms_service.py tests/test_rooms_gateway.py
