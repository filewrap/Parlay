name: Rooms focused auth verification

on:
  push:
    paths:
      - tests/rooms_critical_patch.py

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install -e . 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' httpx websockets pytest pytest-asyncio ruff mypy
      - run: python tests/rooms_critical_patch.py
      - run: ruff check --fix src/parlay/rooms/gateway.py src/parlay/rooms/service.py tests/test_rooms_gateway.py tests/test_rooms_service.py
      - run: ruff format src/parlay/rooms/gateway.py src/parlay/rooms/service.py tests/test_rooms_gateway.py tests/test_rooms_service.py
      - run: pytest -q tests/test_rooms_gateway.py::test_official_init_data_signature_and_time_checks
      - run: pytest -q tests/test_rooms_service.py tests/test_rooms_gateway.py
      - run: ruff format --check src/parlay/rooms/gateway.py src/parlay/rooms/service.py tests/test_rooms_gateway.py tests/test_rooms_service.py
      - run: ruff check src/parlay/rooms/gateway.py src/parlay/rooms/service.py tests/test_rooms_gateway.py tests/test_rooms_service.py
      - run: mypy src/parlay/rooms/gateway.py src/parlay/rooms/service.py tests/test_rooms_gateway.py tests/test_rooms_service.py
      - run: |
          git config user.name 'Alex C11'
          git config user.email 'alex.c992954@gmail.com'
          git rm .github/workflows/rooms-critical.yml tests/rooms_critical_patch.py
          git add src/parlay/rooms/gateway.py src/parlay/rooms/service.py tests/test_rooms_gateway.py tests/test_rooms_service.py
          git commit -m 'fix(rooms): harden Telegram auth and excluded reentry'
          git pull --rebase origin main
          git push origin HEAD:main
