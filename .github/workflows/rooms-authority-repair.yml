name: Rooms authoritative group integration repair

on:
  push:
    paths:
      - .github/workflows/rooms-authority-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repaired scoped patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/rooms-authority-fix.yml').read_text()
          script = workflow.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          helper = '''\ndef method_code(value):
              lines = value.splitlines()
              return "\\n".join([lines[0], *("    " + line for line in lines[1:])])

          def test_code(value):
              output = []
              in_test = False
              for line in value.splitlines():
                  if line.startswith("@pytest"):
                      in_test = False
                  output.append("    " + line if in_test else line)
                  if line.startswith("async def test_"):
                      in_test = True
              return "\\n".join(output)
          '''
          script = script.replace('text = path.read_text()\n', 'text = path.read_text()\n' + helper, 1)
          script = script.replace('def section(start, end, replacement):\n    global text\n', 'def section(start, end, replacement):\n    global text\n    replacement = method_code(replacement)\n', 1)
          script = script.replace("old = '''    def _commit_action", "old = method_code('''    def _commit_action", 1)
          script = script.replace("                  )'''\nnew = '''    def _commit_action", "                  )''')\nnew = method_code('''    def _commit_action", 1)
          script = script.replace("                  )'''\nif old not in text:", "                  )''')\nif old not in text:", 1)
          script = script.replace("helpers = '''    def _save_status", "helpers = method_code('''    def _save_status", 1)
          script = script.replace("\n'''\ntext = text.replace(marker, helpers + marker, 1)", "\n''')\ntext = text.replace(marker, helpers + marker, 1)", 1)
          script = script.replace("old_replace = '''    @staticmethod", "old_replace = method_code('''    @staticmethod", 1)
          script = script.replace("        return result'''\nnew_replace = '''    @staticmethod", "        return result''')\nnew_replace = method_code('''    @staticmethod", 1)
          script = script.replace("        return result'''\nif old_replace not in text:", "        return result''')\nif old_replace not in text:", 1)
          script = script.replace('if "test_group_playback_failure_is_retryable_without_revision_change" not in test_text:', 'addition = test_code(addition)\nif "test_group_playback_failure_is_retryable_without_revision_change" not in test_text:', 1)
          exec(compile(script, 'rooms-authority-patch', 'exec'))
          PY
      - name: Install project
        run: |
          python -m pip install --upgrade pip -q
          pip install -e '.[dev]' -q
      - name: Format and lint fix
        run: |
          ruff check --fix src/parlay/rooms/service.py tests/test_rooms_service.py
          ruff format src/parlay/rooms/service.py tests/test_rooms_service.py
      - name: Scoped service tests
        run: pytest -q tests/test_rooms_service.py
      - name: Full tests
        run: pytest -q
      - name: Type check
        run: mypy
      - name: Commit result and remove temporary runners
        run: |
          git config user.name "Alex C11"
          git config user.email "alex.c992954@gmail.com"
          git rm .github/workflows/rooms-authority-fix.yml .github/workflows/rooms-authority-repair.yml
          git add src/parlay/rooms/service.py tests/test_rooms_service.py docs/rooms-api.md
          git commit -m "fix(rooms): serialize authoritative group playback"
          git push
