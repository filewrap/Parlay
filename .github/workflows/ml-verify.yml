name: ML verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Format owned files
        run: ruff format src/parlay/ml tests/test_ml.py docs/parlay-ml.md
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- src/parlay/ml tests/test_ml.py docs/parlay-ml.md; then
            git config user.name 'Alex C11'
            git config user.email 'alex.c992954@gmail.com'
            git add src/parlay/ml tests/test_ml.py docs/parlay-ml.md
            git commit -m 'style(ml): format Compass subsystem'
            git push
          fi
      - run: ruff check src/parlay/ml tests/test_ml.py
      - run: ruff format --check src/parlay/ml tests/test_ml.py docs/parlay-ml.md
      - run: pytest -q tests/test_ml.py
