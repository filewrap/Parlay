name: ML full verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ml-checks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -e '.[dev]'
      - name: Apply final scoped typing corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path('src/parlay/ml/model.py')
          text = model.read_text()
          text = text.replace(
              '        metrics = self._evaluate(\n',
              '        metrics: dict[str, Any] = self._evaluate(\n',
              1,
          )
          model.write_text(text)

          service = Path('src/parlay/ml/service.py')
          text = service.read_text()
          old = '''            if self._deliver and await asyncio.to_thread(
              self.store.claim_job, "delivery", slot
          ):
              await self._deliver_hour()
          '''
          new = '''            delivery_claimed = await asyncio.to_thread(
              self.store.claim_job, "delivery", slot
          )
          if self._deliver is not None and delivery_claimed:
              await self._deliver_hour()
          '''
          if old not in text:
              raise SystemExit('delivery claim block not found')
          service.write_text(text.replace(old, new, 1))
          PY
          ruff format src/parlay/ml/model.py src/parlay/ml/service.py
          git config user.name 'Alex C11'
          git config user.email 'alex.c992954@gmail.com'
          git add src/parlay/ml/model.py src/parlay/ml/service.py
          git commit -m 'fix(ml): complete strict typing corrections'
          git push
      - run: ruff check src/parlay/ml tests/test_ml.py
      - run: ruff format --check src/parlay/ml tests/test_ml.py docs/parlay-ml.md
      - run: mypy src/parlay/ml
      - run: pytest -q tests/test_ml.py
