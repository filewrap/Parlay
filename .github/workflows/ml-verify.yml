name: ML full verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ml-checks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -e '.[dev]'
      - name: Apply structural delivery typing patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/parlay/ml/service.py')
          lines = path.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if 'if self._deliver and await asyncio.to_thread(' in line)
          end = next(i for i in range(start, len(lines)) if 'await self._deliver_hour()' in lines[i])
          indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
          replacement = [
              f'{indent}deliver = self._deliver',
              f'{indent}if deliver is not None:',
              f'{indent}    delivery_claimed = await asyncio.to_thread(',
              f'{indent}        self.store.claim_job, "delivery", slot',
              f'{indent}    )',
              f'{indent}    if delivery_claimed:',
              f'{indent}        await self._deliver_hour(deliver)',
          ]
          lines[start:end + 1] = replacement
          text = '\n'.join(lines) + '\n'
          text = text.replace(
              '    async def _deliver_hour(self) -> None:\n',
              '    async def _deliver_hour(self, deliver: Delivery) -> None:\n',
              1,
          )
          text = text.replace(
              '            if not items or not self._deliver:\n                continue\n            result = self._deliver(',
              '            if not items:\n                continue\n            result = deliver(',
              1,
          )
          path.write_text(text)
          PY
          ruff format src/parlay/ml/service.py
          git config user.name 'Alex C11'
          git config user.email 'alex.c992954@gmail.com'
          git add src/parlay/ml/service.py
          git commit -m 'fix(ml): type stable delivery callback snapshot'
          git push
      - run: ruff check src/parlay/ml tests/test_ml.py
      - run: ruff format --check src/parlay/ml tests/test_ml.py docs/parlay-ml.md
      - run: mypy src/parlay/ml
      - run: pytest -q tests/test_ml.py
