name: Integration verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integration-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]' -q
      - name: Apply scoped fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/parlay/app.py')
          s=p.read_text()
          old='        def active_rooms() -> list[Any]:\n            with sqlite3.connect(self.rooms.db_path) as db:'
          assert old in s
          s=s.replace(old,'        db_path = self.rooms.db_path\n\n        def active_rooms() -> list[Any]:\n            with sqlite3.connect(db_path) as db:',1)
          p.write_text(s)
          p=Path('start.sh')
          s=p.read_text().replace('required=(TELEGRAM_API_ID TELEGRAM_API_HASH OPERATOR_ID GEMINI_API_KEY)','required=(TELEGRAM_API_ID TELEGRAM_API_HASH OPERATOR_ID)')
          p.write_text(s)
          PY
          ruff format src/parlay/app.py
          git config user.name 'kei'
          git config user.email 'xkailashhh@gmail.com'
          git add src/parlay/app.py start.sh
          git commit -m 'fix: narrow room store reference and permit music without Gemini'
          git push origin HEAD:main
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
