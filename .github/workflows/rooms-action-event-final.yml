name: Rooms action event final verification

on:
  push:
    paths:
      - .github/workflows/rooms-action-event-final.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply bounded changes
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          path = Path("src/parlay/rooms/service.py")
          text = path.read_text()
          text = text.replace("import json\n", "import json\nimport logging\n", 1)
          text = text.replace("from typing import Any\n", "from typing import Any\nfrom urllib.parse import parse_qs, urlsplit\n", 1)
          text = text.replace(
              "Search = Callable[[str], Awaitable[list[dict[str, Any]]]]\n",
              "Search = Callable[[str], Awaitable[list[dict[str, Any]]]]\nActionEvent = Callable[[str, int, str, dict[str, Any], str], Awaitable[object]]\n\nlog = logging.getLogger(__name__)\n",
              1,
          )
          text = text.replace(
              "        search: Search | None = None,\n    ) -> None:",
              "        search: Search | None = None,\n        on_action: ActionEvent | None = None,\n    ) -> None:",
              1,
          )
          text = text.replace("        self.search = search\n", "        self.search = search\n        self.on_action = on_action\n", 1)
          text = text.replace(
              "            resolved = self._clean_track(tracks[0])\n",
              "            resolved = self._action_track(self._clean_track(tracks[0]))\n",
              1,
          )

          start = text.index("    async def action(")
          end = text.index("    async def _apply(", start)
          section = text[start:end]
          matches = list(re.finditer(r"(?m)^        self\._publish\(room_id, output\)\n        return output$", section))
          if len(matches) != 1:
              raise SystemExit(f"expected one action return marker, found {len(matches)}")
          callback = '''        self._publish(room_id, output)
              if resolved is not None and action in {"queue_add", "force_play"} and self.on_action:
                  event_id = f"{room_id}:{user_id}:{action_id}"
                  try:
                      await self.on_action(room_id, user_id, action, resolved, event_id)
                  except Exception:
                      log.exception("room action callback failed", extra={"event_id": event_id})
              return output'''
          callback = "\n".join(line[8:] if line.startswith("        ") else line for line in callback.splitlines())
          match = matches[0]
          section = section[:match.start()] + callback + section[match.end():]
          text = text[:start] + section + text[end:]

          helper_marker = "    def _clean_track(self, track: Any) -> dict:\n"
          if helper_marker not in text:
              raise SystemExit("clean track marker missing")
          helper = '''    def _action_track(self, track: dict[str, Any]) -> dict[str, Any]:
                  """Return a callback-safe track with a canonical YouTube identity."""
                  candidate = track.get("youtube_id")
                  valid = isinstance(candidate, str) and len(candidate) == 11 and all(
                      char.isalnum() or char in "-_" for char in candidate
                  )
                  if not valid:
                      parsed = urlsplit(track["source_url"])
                      candidate = (
                          parsed.path.strip("/").split("/", 1)[0]
                          if parsed.netloc.lower() in {"youtu.be", "www.youtu.be"}
                          else parse_qs(parsed.query).get("v", [""])[0]
                      )
                  if len(candidate) != 11 or not all(
                      char.isalnum() or char in "-_" for char in candidate
                  ):
                      raise RoomError("invalid_track", "Search returned an invalid YouTube track")
                  output = dict(track)
                  output["youtube_id"] = candidate
                  return output

              '''
          helper = "\n".join(line[4:] if line.startswith("    ") else line for line in helper.splitlines())
          text = text.replace(helper_marker, helper + helper_marker, 1)
          path.write_text(text)

          tests = Path("tests/test_rooms_service.py")
          body = tests.read_text().replace('watch?v=abc",', 'watch?v=abc12345678",').replace('"youtube_id": "abc",', '"youtube_id": "abc12345678",')
          addition = '''

          @pytest.mark.asyncio
          async def test_action_callback_is_post_commit_outside_lock_and_not_replayed(tmp_path):
              events = []
              service = None

              async def on_action(room_id, user_id, action, track, event_id):
                  async with service._lock(room_id):
                      persisted = await service.snapshot(room_id, user_id)
                  events.append((room_id, user_id, action, track, event_id, persisted))

              service = RoomService(tmp_path / "rooms.db", search=search, on_action=on_action)
              room = await service.create_personal(1)
              queued = await service.action(
                  room["id"], 1, "select-1", room["revision"], "queue_add", {"query": "Selected"}
              )
              replay = await service.action(
                  room["id"], 1, "select-1", room["revision"], "queue_add", {"query": "Selected"}
              )
              assert replay == queued
              assert len(events) == 1
              event = events[0]
              assert event[:3] == (room["id"], 1, "queue_add")
              assert event[3]["youtube_id"] == "abc12345678"
              assert event[4] == f"{room['id']}:1:select-1"
              assert event[5]["revision"] == queued["revision"]


          @pytest.mark.asyncio
          async def test_action_callback_ignores_unauthorized_and_failed_actions(tmp_path):
              events = []

              async def on_action(*args):
                  events.append(args)

              async def no_results(query):
                  return []

              service = RoomService(tmp_path / "rooms.db", search=search, on_action=on_action)
              room = await service.create_personal(1)
              with pytest.raises(RoomError, match="access"):
                  await service.action(
                      room["id"], 2, "denied", room["revision"], "force_play", {"query": "Denied"}
                  )
              assert events == []

              failed = RoomService(tmp_path / "failed.db", search=no_results, on_action=on_action)
              other = await failed.create_personal(1)
              with pytest.raises(RoomError, match="No playable"):
                  await failed.action(
                      other["id"], 1, "missing", other["revision"], "queue_add", {"query": "Missing"}
                  )
              assert events == []


          @pytest.mark.asyncio
          async def test_action_callback_failure_does_not_rollback_committed_action(tmp_path):
              calls = []

              async def on_action(*args):
                  calls.append(args)
                  raise RuntimeError("ML unavailable")

              service = RoomService(tmp_path / "rooms.db", search=search, on_action=on_action)
              room = await service.create_personal(1)
              played = await service.action(
                  room["id"], 1, "play-1", room["revision"], "force_play", {"query": "Played"}
              )
              assert played["playback"]["track"]["title"] == "Played"
              persisted = await service.snapshot(room["id"], 1)
              assert persisted == played
              replay = await service.action(
                  room["id"], 1, "play-1", room["revision"], "force_play", {"query": "Played"}
              )
              assert replay == played
              assert len(calls) == 1
          '''
          addition = "\n".join(line[10:] if line.startswith("          ") else line for line in addition.splitlines())
          if "test_action_callback_is_post_commit_outside_lock_and_not_replayed" not in body:
              body += addition
          tests.write_text(body)
          PY
          python /tmp/patch.py
      - name: Install and verify
        run: |
          python -m pip install --upgrade pip -q
          pip install -e '.[dev]' -q
          ruff check --fix src/parlay/rooms/service.py tests/test_rooms_service.py
          ruff format src/parlay/rooms/service.py tests/test_rooms_service.py
          ruff check src/parlay/rooms/service.py tests/test_rooms_service.py
          ruff format --check src/parlay/rooms/service.py tests/test_rooms_service.py
          pytest -q tests/test_rooms_service.py
          mypy src/parlay/rooms/service.py
      - name: Commit scoped files and clean temporary workflows
        run: |
          git config user.name "Alex C11"
          git config user.email "alex.c992954@gmail.com"
          git rm .github/workflows/rooms-action-event.yml .github/workflows/rooms-action-event-repair.yml .github/workflows/rooms-action-event-final.yml
          git add src/parlay/rooms/service.py tests/test_rooms_service.py
          git commit -m "feat(rooms): emit idempotent playback action events"
          git push
