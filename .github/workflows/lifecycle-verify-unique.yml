name: lifecycle-verify-unique
on:
  push:
    paths:
      - .github/lifecycle_patch.py
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python .github/lifecycle_patch.py
      - run: pytest -q tests/test_app_lifecycle.py
      - run: mypy src/parlay/app.py
      - run: ruff check src/parlay/app.py tests/test_app_lifecycle.py
      - run: |
          git config user.name 'Alex C11'
          git config user.email 'alex.c992954@gmail.com'
          git rm .github/lifecycle_patch.py .github/workflows/lifecycle-verify-unique.yml
          git add src/parlay/app.py tests/test_app_lifecycle.py
          git commit -m 'Harden bounded application lifecycle cleanup'
          git push origin HEAD:main
