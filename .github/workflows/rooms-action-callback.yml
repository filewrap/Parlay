name: Rooms action callback verification
on:
  push:
    paths: [.github/workflows/rooms-action-callback.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/parlay/rooms/service.py')
          s = p.read_text()
          s = s.replace('import json\n', 'import json\nimport logging\n', 1)
          s = s.replace('from typing import Any\n', 'from typing import Any\nfrom urllib.parse import parse_qs, urlsplit\n', 1)
          s = s.replace('Search = Callable[[str], Awaitable[list[dict[str, Any]]]]\n', 'Search = Callable[[str], Awaitable[list[dict[str, Any]]]]\nActionEvent = Callable[[str, int, str, dict[str, Any], str], Awaitable[object]]\n\nlog = logging.getLogger(__name__)\n', 1)
          s = s.replace('        search: Search | None = None,\n    ) -> None:', '        search: Search | None = None,\n        on_action: ActionEvent | None = None,\n    ) -> None:', 1)
          s = s.replace('        self.search = search\n', '        self.search = search\n        self.on_action = on_action\n', 1)

          start = s.index('    async def action(')
          end = s.index('    async def _apply(', start)
          section = s[start:end]
          pos = section.rfind('return output')
          if pos < 0:
              raise SystemExit('action return missing')
          line_start = section.rfind('\n', 0, pos) + 1
          indent = section[line_start:pos]
          callback = (
              f'{indent}if resolved is not None and action in {{"queue_add", "force_play"}} and self.on_action:\n'
              f'{indent}    event_id = f"{{room_id}}:{{user_id}}:{{action_id}}"\n'
              f'{indent}    try:\n'
              f'{indent}        await self.on_action(room_id, user_id, action, self._action_track(resolved), event_id)\n'
              f'{indent}    except Exception:\n'
              f'{indent}        log.exception("room action callback failed", extra={{"event_id": event_id}})\n'
          )
          section = section[:line_start] + callback + section[line_start:]
          s = s[:start] + section + s[end:]

          marker = '    @staticmethod\n    def _clean_track(track: dict) -> dict:\n'
          helper = '''    @staticmethod
          def _action_track(track: dict[str, Any]) -> dict[str, Any]:
              candidate = track.get("youtube_id")
              valid = isinstance(candidate, str) and len(candidate) == 11 and all(
                  char.isalnum() or char in "-_" for char in candidate
              )
              if not valid:
                  parsed = urlsplit(track["source_url"])
                  candidate = (
                      parsed.path.strip("/").split("/", 1)[0]
                      if parsed.netloc.lower() in {"youtu.be", "www.youtu.be"}
                      else parse_qs(parsed.query).get("v", [""])[0]
                  )
              if not isinstance(candidate, str) or len(candidate) != 11 or not all(
                  char.isalnum() or char in "-_" for char in candidate
              ):
                  raise RoomError("invalid_track", "Search returned an invalid YouTube track")
              output = dict(track)
              output["youtube_id"] = candidate
              return output

          '''
          helper = '\n'.join(x[4:] if x.startswith('    ') else x for x in helper.splitlines())
          if marker not in s:
              raise SystemExit('track helper marker missing')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          t = Path('tests/test_rooms_service.py')
          body = t.read_text().replace('watch?v=abc",', 'watch?v=abc12345678",').replace('"youtube_id": "abc",', '"youtube_id": "abc12345678",')
          addition = '''

          @pytest.mark.asyncio
          async def test_action_callback_success_replay_and_failure_isolation(tmp_path):
              events = []
              service = None

              async def on_action(room_id, user_id, action, track, event_id):
                  async with service._lock(room_id):
                      persisted = await service.snapshot(room_id, user_id)
                  events.append((room_id, user_id, action, track, event_id, persisted))
                  if action == "force_play":
                      raise RuntimeError("ML unavailable")

              service = RoomService(tmp_path / "rooms.db", search=search, on_action=on_action)
              room = await service.create_personal(1)
              queued = await service.action(room["id"], 1, "select-1", room["revision"], "queue_add", {"query": "Selected"})
              assert await service.action(room["id"], 1, "select-1", room["revision"], "queue_add", {"query": "Selected"}) == queued
              assert len(events) == 1
              assert events[0][:3] == (room["id"], 1, "queue_add")
              assert events[0][3]["youtube_id"] == "abc12345678"
              assert events[0][4] == f"{room['id']}:1:select-1"
              assert events[0][5]["revision"] == queued["revision"]

              played = await service.action(room["id"], 1, "play-1", queued["revision"], "force_play", {"query": "Played"})
              assert played["playback"]["track"]["title"] == "Played"
              assert await service.snapshot(room["id"], 1) == played
              assert await service.action(room["id"], 1, "play-1", queued["revision"], "force_play", {"query": "Played"}) == played
              assert len(events) == 2


          @pytest.mark.asyncio
          async def test_action_callback_ignores_unauthorized_and_failed_actions(tmp_path):
              events = []
              async def on_action(*args):
                  events.append(args)
              service = RoomService(tmp_path / "rooms.db", search=search, on_action=on_action)
              room = await service.create_personal(1)
              with pytest.raises(RoomError, match="access"):
                  await service.action(room["id"], 2, "denied", room["revision"], "force_play", {"query": "Denied"})
              async def no_results(query):
                  return []
              failed = RoomService(tmp_path / "failed.db", search=no_results, on_action=on_action)
              other = await failed.create_personal(1)
              with pytest.raises(RoomError, match="No playable"):
                  await failed.action(other["id"], 1, "missing", other["revision"], "queue_add", {"query": "Missing"})
              assert events == []
          '''
          addition = '\n'.join(x[10:] if x.startswith('          ') else x for x in addition.splitlines())
          body += addition
          t.write_text(body)
          PY
      - name: Verify and commit
        run: |
          pip install -e '.[dev]' -q
          ruff check --fix src/parlay/rooms/service.py tests/test_rooms_service.py
          ruff format src/parlay/rooms/service.py tests/test_rooms_service.py
          ruff check src/parlay/rooms/service.py tests/test_rooms_service.py
          ruff format --check src/parlay/rooms/service.py tests/test_rooms_service.py
          pytest -q tests/test_rooms_service.py
          mypy src/parlay/rooms/service.py
          git config user.name "Alex C11"
          git config user.email "alex.c992954@gmail.com"
          git rm .github/workflows/rooms-action-callback.yml
          git add src/parlay/rooms/service.py tests/test_rooms_service.py
          git commit -m "feat(rooms): emit idempotent playback action events"
          git push
