name: Activity type fix helper

'on':
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix typed row conversion
        run: python -c "from pathlib import Path; p=Path('src/parlay/activity.py'); s=p.read_text(); old='        return _Activity(*row[:5], bool(row[5]), *row[6:])'; new='        return _Activity(\\n            chat_id=int(row[0]),\\n            call_id=row[1],\\n            access_hash=row[2],\\n            call_state=str(row[3]),\\n            membership=str(row[4]),\\n            transport=bool(row[5]),\\n            version=row[6],\\n            unavailable_reason=row[7],\\n        )'; assert old in s; p.write_text(s.replace(old,new,1))"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff>=0.6' -q
      - run: ruff format src/parlay/activity.py tests/test_activity.py
      - run: ruff check src/parlay/activity.py tests/test_activity.py
      - name: Commit owned file
        run: git config user.name 'Alex C11' && git config user.email 'alex.c992954@gmail.com' && git add src/parlay/activity.py tests/test_activity.py && git commit -m 'Fix activity row typing' && git push
