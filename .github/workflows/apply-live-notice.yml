name: Apply live notice

on:
  push:
    paths:
      - '.github/workflows/apply-live-notice.yml'
      - '.github/scripts/apply_live_notice.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Apply patch
        run: python .github/scripts/apply_live_notice.py
      - name: Ruff fix
        run: ruff check --fix src tests
      - name: Ruff format
        run: ruff format src tests
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Commit result
        run: |
          git config user.name kei
          git config user.email xkailashhh@gmail.com
          git add -A
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m 'feat(voice): post in-call notice when AI voice engages and speaks'
            git push
          fi
