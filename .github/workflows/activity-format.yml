name: Activity callback safety helper

'on':
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Avoid stop self-await
        run: python -c "from pathlib import Path; p=Path('src/parlay/activity.py'); s=p.read_text(); old='            current = asyncio.current_task()\\n            for task in tasks:\\n                if task is not current:\\n                    task.cancel()\\n            if tasks:\\n                await asyncio.gather(*tasks, return_exceptions=True)\\n'; new='            current = asyncio.current_task()\\n            other_tasks = tasks - {current}\\n            for task in other_tasks:\\n                task.cancel()\\n            if other_tasks:\\n                await asyncio.gather(*other_tasks, return_exceptions=True)\\n'; assert old in s; p.write_text(s.replace(old,new,1))"
      - run: python -m pip install 'ruff>=0.6' -q
      - run: ruff format src/parlay/activity.py tests/test_activity.py
      - run: ruff check src/parlay/activity.py tests/test_activity.py
      - name: Commit owned file
        run: git config user.name 'Alex C11' && git config user.email 'alex.c992954@gmail.com' && git add src/parlay/activity.py tests/test_activity.py && git commit -m 'Fix activity callback self-await' && git push
