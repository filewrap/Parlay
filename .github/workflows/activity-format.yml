name: Activity callback safety helper

'on':
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply callback safety update
        run: |
          python - <<'PY'
          from pathlib import Path
          activity = Path('src/parlay/activity.py')
          text = activity.read_text()
          old = '''            current = asyncio.current_task()
            for task in tasks:
                if task is not current:
                    task.cancel()
            if tasks:
                await asyncio.gather(*tasks, return_exceptions=True)
'''
          new = '''            current = asyncio.current_task()
            other_tasks = tasks - {current}
            for task in other_tasks:
                task.cancel()
            if other_tasks:
                await asyncio.gather(*other_tasks, return_exceptions=True)
'''
          if old not in text:
              raise SystemExit('expected stop block not found')
          activity.write_text(text.replace(old, new, 1))
          tests = Path('tests/test_activity.py')
          content = tests.read_text()
          content += '''

async def test_unavailable_callback_can_set_transport_without_deadlock(tmp_path) -> None:
    client = FakeClient()
    chat_id = setup_chat(client, 101, 11)
    client.participants[11] = [participant()]
    callback_done = asyncio.Event()
    tracker = None

    async def callback(received_chat_id: int, reason: str) -> None:
        assert received_chat_id == chat_id
        assert reason == "call_discarded"
        assert tracker is not None
        await tracker.set_transport(chat_id, False)
        callback_done.set()

    tracker = ActivityTracker(client, tmp_path / "activity.db", 7, callback)
    await tracker.start()
    try:
        update = types.UpdateGroupCall(
            call=types.GroupCallDiscarded(id=11, access_hash=110, duration=8),
            chat_id=101,
        )
        await asyncio.wait_for(tracker.handle_update(update), timeout=1)
        assert callback_done.is_set()
    finally:
        await tracker.stop()


async def test_unavailable_callback_can_stop_from_reconcile_worker(tmp_path) -> None:
    client = FakeClient()
    chat_id = setup_chat(client, 101, 11)
    client.participants[11] = [participant()]
    callback_done = asyncio.Event()
    tracker = None

    async def callback(received_chat_id: int, reason: str) -> None:
        assert received_chat_id == chat_id
        assert reason == "call_discarded"
        assert tracker is not None
        await tracker.stop()
        callback_done.set()

    tracker = ActivityTracker(client, tmp_path / "activity.db", 7, callback)
    await tracker.start()
    client.calls[101] = None
    tracker._schedule_reconcile(chat_id)
    await asyncio.wait_for(callback_done.wait(), timeout=1)
    with pytest.raises(RuntimeError, match="not started"):
        await tracker.status_text(chat_id)
    await tracker.stop()
'''
          tests.write_text(content)
          PY
      - run: python -m pip install 'ruff>=0.6' -q
      - run: ruff format src/parlay/activity.py tests/test_activity.py
      - run: ruff check src/parlay/activity.py tests/test_activity.py
      - run: |
          git config user.name 'Alex C11'
          git config user.email 'alex.c992954@gmail.com'
          git add src/parlay/activity.py tests/test_activity.py
          git commit -m 'Fix activity callback reentrancy'
          git push
