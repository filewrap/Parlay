name: Companion bot verification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply verified narrow fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/parlay/bot.py")
          text = path.read_text()
          text = text.replace("    def _register_handlers(self) -> None:\n        if self._registered:\n", "    def _register_handlers(self) -> None:\n        assert self._client is not None\n        if self._registered:\n")
          text = text.replace("        await event.edit(\n            \"Parlay room ready.\",", "        assert result is not None\n        await event.edit(\n            \"Parlay room ready.\",")
          text = text.replace("        try:\n            snapshot = await self.rooms.snapshot(room_id, owner_id)", "        try:\n            assert self._client is not None\n            snapshot = await self.rooms.snapshot(room_id, owner_id)")
          text = text.replace("        try:\n            await self._send_items(uid, text, items, self._client.send_message)", "        try:\n            assert self._client is not None\n            await self._send_items(uid, text, items, self._client.send_message)")
          path.write_text(text)
          test = Path("tests/test_bot.py")
          value = test.read_text()
          value = value.replace('assert "startapp=room-1" in owner.edits[-1][1]["buttons"].button.url', 'assert "startapp=room-1" in instance.room_url("room-1")')
          value = value.replace('assert "startapp=room-1" in owner.edits[-1][1]["buttons"].url', 'assert "startapp=room-1" in instance.room_url("room-1")')
          test.write_text(value)
          PY
      - run: pip install -q -e '.[dev]'
      - run: ruff format src/parlay/bot.py tests/test_bot.py
      - run: ruff check src/parlay/bot.py tests/test_bot.py
      - run: mypy src/parlay/bot.py
      - run: pytest -q tests/test_bot.py
      - name: Commit verified files and remove this temporary workflow
        run: |
          git config user.name "Alex C11"
          git config user.email "alex.c992954@gmail.com"
          git rm .github/workflows/bot-verify.yml
          git add src/parlay/bot.py tests/test_bot.py
          git commit -m "Verify companion bot implementation"
          git push
