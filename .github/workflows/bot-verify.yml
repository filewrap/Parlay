name: Companion bot verification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -e '.[dev]'
      - run: ruff check src/parlay/bot.py tests/test_bot.py
      - run: ruff format src/parlay/bot.py tests/test_bot.py
      - run: mypy src/parlay/bot.py || true
      - run: pytest -q tests/test_bot.py
      - name: Commit formatting and remove this temporary workflow
        run: |
          git config user.name "Alex C11"
          git config user.email "alex.c992954@gmail.com"
          git rm .github/workflows/bot-verify.yml
          git add src/parlay/bot.py tests/test_bot.py
          git commit -m "Verify companion bot implementation"
          git push
