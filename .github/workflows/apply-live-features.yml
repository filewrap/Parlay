name: apply-live-features

on:
  push:
    paths:
      - '.github/scripts/apply_live_features.py'
      - '.github/workflows/apply-live-features.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
      - name: Install project
        run: pip install -e '.[dev]' -q
      - name: Apply patch
        run: python .github/scripts/apply_live_features.py
      - name: Ruff format app.py
        run: ruff format src/parlay/app.py
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check src/parlay/app.py
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Commit result
        run: |
          git config user.name "kei"
          git config user.email "xkailashhh@gmail.com"
          git add src/parlay/app.py
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "feat(app): instant /tem voice switch, engage helper, suppress self-join"
            git push
          fi
