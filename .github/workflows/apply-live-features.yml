name: apply-live-features

on:
  push:
    paths:
      - '.github/scripts/apply_live_features.py'
      - '.github/workflows/apply-live-features.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy pytest pytest-asyncio
      - name: Apply patch
        run: python .github/scripts/apply_live_features.py
      - name: Ruff format
        run: ruff format src/parlay/app.py
      - name: Ruff check
        run: ruff check src/parlay/app.py
      - name: Ruff format check
        run: ruff format --check src/parlay/app.py
      - name: Mypy
        run: mypy src/parlay
      - name: Tests
        run: pytest -q
      - name: Commit result
        run: |
          git config user.name "kei"
          git config user.email "xkailashhh@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "feat(app): instant /tem voice switch, engage helper, suppress self-join"
            git push
          fi
