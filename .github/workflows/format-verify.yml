name: format-verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-verify.yml'

permissions:
  contents: write

jobs:
  format-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
      - name: Install project
        run: pip install -e '.[dev]' -q
      - name: Auto-format and fix
        run: |
          ruff check --fix .
          ruff format .
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Commit formatting if changed
        run: |
          git config user.name kei
          git config user.email xkailashhh@gmail.com
          if ! git diff --quiet; then
            git commit -am 'style: apply ruff formatting to the cookieless player'
            git push origin main
          else
            echo 'no formatting changes needed'
          fi
