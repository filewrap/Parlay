name: lifecycle-verify

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply bounded lifecycle hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/parlay/app.py")
          source = path.read_text()
          source = source.replace("import asyncio\nimport logging\n", "import asyncio\nimport inspect\nimport logging\n")
          source = source.replace(
              """        finally:
            self._recoveries.pop(chat_id, None)
""",
              """        finally:
            task = asyncio.current_task()
            if self._recoveries.get(chat_id) is task:
                self._recoveries.pop(chat_id, None)
""",
          )
          source = source.replace(
              """        async def apply() -> None:
            if runtime is not None and self.registry.get(chat_id) is not runtime:
                return
""",
              """        async def apply() -> None:
            if self.registry.get(chat_id) is not runtime:
                return
""",
          )
          marker = "    async def run(self) -> None:\n"
          head, separator, _ = source.partition(marker)
          if not separator:
              raise SystemExit("run marker not found")
          run = '''    @staticmethod
    def _operator_reference(operator_id: str) -> str | int:
        return int(operator_id) if operator_id.isdecimal() else operator_id

    async def _cleanup_step(self, name: str, action: Any) -> None:
        try:
            result = action()
            if inspect.isawaitable(result):
                await result
        except BaseException:
            log.exception("Cleanup step failed: %s", name)

    async def _shutdown_server(self, server_task: asyncio.Task[Any] | None) -> None:
        if self._server is not None:
            self._server.should_exit = True
        if server_task is None:
            return
        try:
            await asyncio.wait_for(asyncio.shield(server_task), timeout=15)
        except TimeoutError:
            log.warning("Room gateway did not stop within 15 seconds; cancelling it")
            server_task.cancel()
            await asyncio.gather(server_task, return_exceptions=True)
        except BaseException:
            log.exception("Room gateway shutdown failed")

    async def run(self) -> None:
        server_task: asyncio.Task[Any] | None = None
        waiters: list[asyncio.Task[Any]] = []
        try:
            await start_authorized(self.client)
            me = await self.client.get_me()
            self._account_id = me.id
            self.commands.set_account(me.id, getattr(me, "username", None))
            operator = await self.client.get_entity(
                self._operator_reference(self.config.operator_id)
            )
            self.commands.set_operator_id(str(operator.id))
            self._operator_peer = await self.client.get_input_entity(operator)
            self.activity = ActivityTracker(
                self.client, self.config.activity_db_path, me.id, self._queue_activity_unavailable
            )
            await self.activity.start()
            self._activity_ready = True
            self.membership = MembershipWatcher(
                str(me.id),
                [
                    MembershipNotifier(self._notify_operator),
                    AuditLogStore(self.config.audit_log_path),
                ],
            )
            self.client.add_event_handler(self._on_raw_update, events.Raw())
            self.client.add_event_handler(self._on_chat_action, events.ChatAction())
            self.command_wrapper.install()
            self.compass = await asyncio.to_thread(
                CompassService,
                self.config.ml_db_path,
                self.config.ml_model_dir,
                self.config.youtube_api_key,
            )

            if self.config.bot_token:
                self.rooms = await asyncio.to_thread(
                    RoomService,
                    self.config.room_db_path,
                    self._room_playback,
                    authority=self._authority,
                    member=self._member,
                    search=self.search,
                    on_action=self._room_action_event,
                )
                await self.rooms.start()
                self.bot = CompanionBot(
                    self.config, self.rooms, self.compass, self._play_for_user, self._authority
                )
                await self.bot.start()
                self.rooms.on_reentry = self.bot.notify_reentry
                await self.compass.start(deliver=self.bot.deliver)
                import uvicorn

                gateway = create_app(
                    self.rooms,
                    self.config.bot_token,
                    list(self.config.allowed_origins),
                    self.compass,
                    self.search,
                )
                self._server = uvicorn.Server(
                    uvicorn.Config(
                        gateway,
                        host=self.config.backend_host,
                        port=self.config.backend_port,
                        access_log=False,
                        ws_max_size=65_536,
                        workers=1,
                    )
                )
                server_task = asyncio.create_task(self._server.serve(), name="rooms-asgi")
                self._spawn(self._reconcile_stored_rooms())
            else:
                log.warning("BOT_TOKEN is absent: companion bot and room gateway are disabled")
                await self.compass.start()

            waiters.append(asyncio.create_task(self.client.run_until_disconnected()))
            if server_task is not None:
                waiters.append(server_task)
            if self.bot is not None and self.bot.client is not None:
                waiters.append(asyncio.create_task(self.bot.client.run_until_disconnected()))
            done, _ = await asyncio.wait(waiters, return_when=asyncio.FIRST_COMPLETED)
            for task in done:
                task.result()
        finally:
            self._shutting_down = True
            for task in waiters:
                if task is not server_task:
                    task.cancel()
            await asyncio.gather(
                *(task for task in waiters if task is not server_task),
                return_exceptions=True,
            )
            await self._shutdown_server(server_task)
            await self._cleanup_step("command wrapper", self.command_wrapper.uninstall)
            await self._cleanup_step(
                "raw update handler",
                lambda: self.client.remove_event_handler(self._on_raw_update),
            )
            await self._cleanup_step(
                "chat action handler",
                lambda: self.client.remove_event_handler(self._on_chat_action),
            )
            for task in tuple(self._jobs):
                task.cancel()
            await asyncio.gather(*tuple(self._jobs), return_exceptions=True)
            await self._cleanup_step("runtime registry", self.registry.close)
            if self.compass is not None:
                await self._cleanup_step("Compass", self.compass.stop)
            if self.bot is not None:
                await self._cleanup_step("companion bot", self.bot.stop)
            if self.rooms is not None:
                await self._cleanup_step("room service", self.rooms.stop)
            self._activity_ready = False
            if self.activity is not None:
                await self._cleanup_step("activity tracker", self.activity.stop)
            await self._cleanup_step("Telegram client", self.client.disconnect)
'''
          path.write_text(head + run)
          PY
          cat > tests/test_app_lifecycle.py <<'PY'
          """Focused regression tests for application startup and shutdown boundaries."""

          import asyncio
          from types import SimpleNamespace
          from unittest.mock import AsyncMock, Mock

          import pytest

          from parlay.app import ParlayApp


          def lifecycle_app() -> ParlayApp:
              app = object.__new__(ParlayApp)
              app.config = SimpleNamespace(operator_id="7")
              app.client = Mock(
                  remove_event_handler=Mock(),
                  disconnect=AsyncMock(),
              )
              app.command_wrapper = Mock(uninstall=Mock())
              app.registry = Mock(close=AsyncMock())
              app.compass = None
              app.bot = None
              app.rooms = None
              app.activity = None
              app._activity_ready = False
              app._jobs = set()
              app._recoveries = {}
              app._shutting_down = False
              app._server = None
              return app


          @pytest.mark.asyncio
          async def test_authorization_failure_runs_cleanup_without_masking(monkeypatch):
              app = lifecycle_app()
              failure = RuntimeError("authorization failed")
              monkeypatch.setattr("parlay.app.start_authorized", AsyncMock(side_effect=failure))

              with pytest.raises(RuntimeError, match="authorization failed"):
                  await app.run()

              app.registry.close.assert_awaited_once()
              app.client.disconnect.assert_awaited_once()


          @pytest.mark.asyncio
          async def test_cleanup_failure_does_not_skip_later_steps_or_mask_startup(monkeypatch):
              app = lifecycle_app()
              app.compass = Mock(stop=AsyncMock(side_effect=RuntimeError("compass stop")))
              app.bot = Mock(stop=AsyncMock())
              app.rooms = Mock(stop=AsyncMock())
              app.activity = Mock(stop=AsyncMock())
              monkeypatch.setattr(
                  "parlay.app.start_authorized",
                  AsyncMock(side_effect=ValueError("startup failed")),
              )

              with pytest.raises(ValueError, match="startup failed"):
                  await app.run()

              app.bot.stop.assert_awaited_once()
              app.rooms.stop.assert_awaited_once()
              app.activity.stop.assert_awaited_once()
              app.client.disconnect.assert_awaited_once()


          def test_numeric_operator_reference_uses_telegram_id_not_phone_lookup():
              assert ParlayApp._operator_reference("7") == 7
              assert ParlayApp._operator_reference("+15551234567") == "+15551234567"
              assert ParlayApp._operator_reference("operator") == "operator"


          @pytest.mark.asyncio
          async def test_runtime_none_callback_does_not_close_later_replacement():
              app = lifecycle_app()
              replacement = object()
              current = None
              app.registry.get = lambda _chat_id: current
              app.registry.leave = AsyncMock()
              app.rooms = Mock(end_group=AsyncMock())
              pending = []
              app._spawn = lambda awaitable: pending.append(awaitable)

              await app._queue_activity_unavailable(-100, "call_discarded")
              current = replacement
              await pending[0]

              app.registry.leave.assert_not_awaited()
              app.rooms.end_group.assert_not_awaited()


          @pytest.mark.asyncio
          async def test_old_recovery_cannot_remove_new_mapping(monkeypatch):
              app = lifecycle_app()
              entered_sleep = asyncio.Event()

              async def blocked_sleep(_delay):
                  entered_sleep.set()
                  await asyncio.Event().wait()

              monkeypatch.setattr(asyncio, "sleep", blocked_sleep)
              old = asyncio.create_task(app._recover(-100))
              app._recoveries[-100] = old
              await entered_sleep.wait()
              replacement = asyncio.create_task(asyncio.Event().wait())
              app._recoveries[-100] = replacement

              old.cancel()
              await asyncio.gather(old, return_exceptions=True)

              assert app._recoveries[-100] is replacement
              replacement.cancel()
              await asyncio.gather(replacement, return_exceptions=True)


          @pytest.mark.asyncio
          async def test_gateway_shutdown_is_bounded_then_cancelled(monkeypatch):
              app = lifecycle_app()
              app._server = SimpleNamespace(should_exit=False)
              task = asyncio.create_task(asyncio.Event().wait())
              timeout = None

              async def expire(awaitable, *, timeout):
                  del awaitable
                  nonlocal_timeout[0] = timeout
                  raise TimeoutError

              nonlocal_timeout = [timeout]
              monkeypatch.setattr(asyncio, "wait_for", expire)

              await app._shutdown_server(task)

              assert app._server.should_exit
              assert nonlocal_timeout[0] == 15
              assert task.cancelled()
          PY
      - name: Scoped verification
        run: |
          pytest -q tests/test_app_lifecycle.py
          mypy src/parlay/app.py
          ruff check src/parlay/app.py tests/test_app_lifecycle.py
      - name: Commit tested change and remove workflow
        run: |
          git config user.name 'Alex C11'
          git config user.email 'alex.c992954@gmail.com'
          git rm .github/workflows/lifecycle-verify.yml
          git add src/parlay/app.py tests/test_app_lifecycle.py
          git commit -m 'Harden bounded application lifecycle cleanup'
          git push origin HEAD:main
