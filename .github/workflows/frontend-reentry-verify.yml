name: Frontend reentry verify
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply re-entry UI integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/components/room-app.tsx')
          s = p.read_text()
          replacements = {
            'const [connection, setConnection] = useState<ConnectionState>("connecting"); const [error, setError] = useState(""); const [password, setPassword] = useState("");': 'const [connection, setConnection] = useState<ConnectionState>("connecting"); const [error, setError] = useState(""); const [password, setPassword] = useState(""); const [reentryRequired, setReentryRequired] = useState(false); const [reentryPending, setReentryPending] = useState(false);',
            'else setError(errorText(e));\n      setConnection("offline");': 'else if (e instanceof ApiError && e.status === 403 && e.code === "reentry_required") { setReentryRequired(true); setError(""); }\n      else setError(errorText(e));\n      setConnection("offline");',
            'const join = async (event: FormEvent) => { event.preventDefault(); if (!api) return; try { setSnapshot(await api.join(roomId, password || undefined)); await connect(roomId); } catch (e) { setError(errorText(e)); } };': 'const join = async (event: FormEvent) => { event.preventDefault(); if (!api) return; try { setReentryRequired(false); setSnapshot(await api.join(roomId, password || undefined)); await connect(roomId); } catch (e) { if (e instanceof ApiError && e.status === 403 && e.code === "reentry_required") { setReentryRequired(true); setError(""); } else setError(errorText(e)); } };\n  const requestReentry = async () => { if (!api || !roomId || reentryPending) return; try { setError(""); const result = await api.requestReentry(roomId); if (result.status === "pending") { setReentryPending(true); setReentryRequired(false); } } catch (e) { setError(errorText(e)); } };',
            '{roomId && connection !== "connecting" && <form className="mt-5 space-y-3" onSubmit={join}><input className="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3" type="password" placeholder="Room password, if required" value={password} onChange={e => setPassword(e.target.value)} /><button className="w-full rounded-xl bg-violet-500 px-4 py-3 font-semibold" type="submit">Join room</button></form>}': '{roomId && connection !== "connecting" && (reentryRequired || reentryPending ? <div className="mt-5 space-y-3"><p className="text-sm text-amber-100">{reentryPending ? "Your re-entry request is pending owner approval." : "The owner must approve your re-entry."}</p><button className="w-full rounded-xl bg-amber-400/15 px-4 py-3 font-semibold text-amber-100 disabled:opacity-60" type="button" disabled={reentryPending} onClick={requestReentry}>{reentryPending ? "Request pending" : "Request re-entry"}</button></div> : <form className="mt-5 space-y-3" onSubmit={join}><input className="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3" type="password" placeholder="Room password, if required" value={password} onChange={e => setPassword(e.target.value)} /><button className="w-full rounded-xl bg-violet-500 px-4 py-3 font-semibold" type="submit">Join room</button></form>)}'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected source: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Clean install
        working-directory: web
        run: npm ci
      - name: Production security audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Static build
        working-directory: web
        env:
          NEXT_PUBLIC_BACKEND_URL: https://rooms.example.com
        run: npm run build
      - name: Commit frontend change
        run: |
          git checkout -- web/next-env.d.ts
          git config user.name "Alex C11"
          git config user.email "alex.c992954@gmail.com"
          git add web/components/room-app.tsx
          git commit -m "fix(web): request re-entry without a room snapshot"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
