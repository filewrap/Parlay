name: Runtime verify

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]' -q
      - name: Scoped lint
        run: ruff check src/parlay/runtime.py src/parlay/audio/rawcall.py src/parlay/music/controller.py src/parlay/music/producer.py tests/test_runtime.py tests/test_music.py
      - name: Scoped format
        run: ruff format --check src/parlay/runtime.py src/parlay/audio/rawcall.py src/parlay/music/controller.py src/parlay/music/producer.py tests/test_runtime.py tests/test_music.py
      - name: Scoped types
        run: mypy src/parlay/runtime.py src/parlay/audio/rawcall.py src/parlay/music/controller.py src/parlay/music/producer.py
      - name: Scoped tests
        run: pytest -q tests/test_runtime.py tests/test_music.py
