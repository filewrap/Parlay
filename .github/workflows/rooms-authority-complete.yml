name: Rooms authoritative group integration complete

on:
  push:
    paths:
      - .github/workflows/rooms-authority-complete.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply scoped patch
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/rooms-authority-final.yml').read_text()
          script = workflow.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script, 'patch', 'exec'))
          PY
      - name: Install project and room integration dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -e '.[dev]' fastapi uvicorn httpx websockets -q
      - name: Format and lint
        run: |
          ruff check --fix src/parlay/rooms/service.py tests/test_rooms_service.py
          ruff format src/parlay/rooms/service.py tests/test_rooms_service.py
          ruff check .
          ruff format --check .
      - name: Scoped tests
        run: pytest -q tests/test_rooms_service.py
      - name: Full tests
        run: pytest -q
      - name: Type check
        run: mypy
      - name: Commit and clean temporary files
        run: |
          git config user.name "Alex C11"
          git config user.email "alex.c992954@gmail.com"
          git rm .github/workflows/rooms-authority-fix.yml .github/workflows/rooms-authority-repair.yml .github/workflows/rooms-authority-final.yml .github/workflows/rooms-authority-diagnostic.yml .github/workflows/rooms-authority-gateway.yml .github/workflows/rooms-authority-complete.yml
          git add src/parlay/rooms/service.py tests/test_rooms_service.py docs/rooms-api.md
          git commit -m "fix(rooms): serialize authoritative group playback"
          git push
