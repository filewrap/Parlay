name: Temporary rooms integrated audit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused service and test fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/parlay/rooms/service.py')
          text = path.read_text()

          old = '''        self.on_action = on_action
          self._locks: dict[str, asyncio.Lock] = {}
          '''
          new = '''        self.on_action = on_action
          self.playback_timeout = 90.0
          self._locks: dict[str, asyncio.Lock] = {}
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        room_id = await asyncio.to_thread(ensure)
          result = await self.snapshot(room_id, owner_id)
          self._publish(room_id, result)
          return result
          '''
          new = '''        room_id = await asyncio.to_thread(ensure)
          if not await self._check(self.member, owner_id, chat_id):
              raise RoomError(
                  "not_group_member", "Telegram group membership is required", 403
              )
          async with self._lock(room_id):
              row = await asyncio.to_thread(self._load, room_id)
              self._active(row)
              data = self._data(row)
              admitted = any(member["user_id"] == owner_id for member in data["members"])
              revision = row["revision"]
              if not admitted:
                  if len(data["members"]) >= data["settings"]["capacity"]:
                      raise RoomError("room_full", "The room is at capacity", 409)
                  data["members"].append(
                      {"user_id": owner_id, "first_name": str(owner_id), "role": "participant"}
                  )
                  revision += 1
                  await asyncio.to_thread(self._save, room_id, revision, data)
              result = await self._snapshot_for(
                  self._replace(row, revision, data), owner_id
              )
          if not admitted:
              self._publish(room_id, result)
          return result
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            row = await asyncio.to_thread(self._load, room_id)
              self._active(row)
              data = self._data(row)
              member = next((m for m in data["members"] if m["user_id"] == user_id), None)
          '''
          new = '''            row = await asyncio.to_thread(self._load, room_id)
              self._active(row)
              self._actionable(row)
              data = self._data(row)
              member = next((m for m in data["members"] if m["user_id"] == user_id), None)
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                actual = await self.playback(*playback_call)
                  if not actual:
                      raise RoomError(
                          "playback_unavailable", "Group playback did not confirm the action", 503
                      )
                  data["playback"] = self._clean_playback(actual)
          '''
          new = '''                try:
                      actual = await asyncio.wait_for(
                          self.playback(*playback_call), timeout=self.playback_timeout
                      )
                  except TimeoutError as exc:
                      raise RoomError(
                          "playback_timeout", "Group playback timed out. Retry the action.", 504
                      ) from exc
                  if not actual:
                      raise RoomError(
                          "playback_unavailable", "Group playback did not confirm the action", 503
                      )
                  row = await asyncio.to_thread(self._load, room_id)
                  self._active(row)
                  self._actionable(row)
                  data["playback"] = self._clean_playback(actual)
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        privileged = authority if row["kind"] == "group" else personal_owner
          notify = playback_call = None
          '''
          new = '''        privileged = authority if row["kind"] == "group" else personal_owner
          delegated = moderator and row["kind"] == "personal"
          can_shared = privileged or delegated
          notify = playback_call = None
          '''
          assert old in text
          text = text.replace(old, new, 1)

          text = text.replace(
              '''            if not (privileged or moderator or settings["queue_all"]):''',
              '''            if not (can_shared or settings["queue_all"]):''',
              1,
          )
          text = text.replace(
              '''            if not (
                  privileged
                  or moderator
                  or (settings["queue_all"] and not settings["owner_lock"])
              ):''',
              '''            if not (
                  can_shared
                  or (
                      row["kind"] == "personal"
                      and settings["queue_all"]
                      and not settings["owner_lock"]
                  )
              ):''',
              1,
          )
          text = text.replace(
              '''            if not (privileged or moderator) or target == row["owner_id"] or protected_moderator:''',
              '''            if not can_shared or target == row["owner_id"] or protected_moderator:''',
              1,
          )
          text = text.replace(
              '''            if not personal_owner:
                  raise RoomError("owner_required", "Only the owner can approve re-entry", 403)''',
              '''            if not privileged:
                  raise RoomError("owner_required", "Only the room authority can approve re-entry", 403)''',
              1,
          )

          old = '''        can_shared = authority or role == "moderator"
          if row["kind"] == "personal" and settings["owner_lock"] and not personal_owner:
              can_shared = False
          '''
          new = '''        delegated = role == "moderator" and row["kind"] == "personal"
          can_shared = authority or delegated
          if row["kind"] == "personal" and settings["owner_lock"] and not personal_owner:
              can_shared = False
          '''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace(
              '''                "control": can_shared
                  or (settings["queue_all"] and not settings["owner_lock"]),''',
              '''                "control": can_shared
                  or (
                      row["kind"] == "personal"
                      and settings["queue_all"]
                      and not settings["owner_lock"]
                  ),''',
              1,
          )

          old = '''    def _active(self, row):
          '''
          new = '''    @staticmethod
              def _actionable(row) -> None:
                  if row["state"] == "recovering":
                      raise RoomError(
                          "room_recovering",
                          "Room playback is recovering. Refresh and retry.",
                          409,
                      )

              def _active(self, row):
          '''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          tests = Path('tests/test_rooms_service.py')
          body = tests.read_text()
          if 'test_ensure_group_admits_later_live_operator' not in body:
              body += r'''


          @pytest.mark.asyncio
          async def test_ensure_group_admits_later_live_operator(tmp_path):
              operators = {7, 8}
              service = RoomService(
                  tmp_path / "rooms.db",
                  authority=lambda uid, chat: uid in operators,
                  member=lambda uid, chat: uid in operators,
              )
              first = await service.ensure_group(100, 1, 7)
              second = await service.ensure_group(100, 1, 8)
              assert second["id"] == first["id"]
              assert second["owner_id"] == 7
              assert second["permissions"]["manage_settings"] is True
              assert {item["user_id"] for item in second["members"]} == {7, 8}


          @pytest.mark.asyncio
          async def test_group_permissions_and_actions_follow_live_authority(tmp_path):
              operators = {7}

              async def playback(chat_id, action, payload):
                  track = payload.get("track")
                  return {
                      "track": track,
                      "status": "playing" if track else "idle",
                      "position_seconds": 0,
                      "queue": [],
                  }

              service = RoomService(
                  tmp_path / "rooms.db",
                  playback=playback,
                  authority=lambda uid, chat: uid in operators,
                  member=lambda uid, chat: uid in {7, 8, 9},
                  search=search,
              )
              room = await service.ensure_group(100, 1, 7)
              room = await service.ensure_group(100, 1, 8)
              room = await service.join(room["id"], user(9))
              operators.clear()
              operators.add(8)

              stale = await service.snapshot(room["id"], 7)
              live = await service.snapshot(room["id"], 8)
              assert not any(stale["permissions"].values())
              assert all(live["permissions"].values())
              with pytest.raises(RoomError, match="restricted"):
                  await service.action(
                      room["id"], 7, "stale", stale["revision"], "queue_add", {"query": "No"}
                  )

              room = await service.action(
                  room["id"], 8, "queue", live["revision"], "queue_add", {"query": "Queued"}
              )
              room = await service.action(
                  room["id"], 8, "play", room["revision"], "force_play", {"query": "Played"}
              )
              room = await service.action(room["id"], 8, "pause", room["revision"], "pause", {})
              room = await service.action(room["id"], 8, "skip", room["revision"], "skip", {})
              room = await service.action(
                  room["id"], 8, "kick", room["revision"], "kick", {"user_id": 9}
              )
              assert 9 not in {item["user_id"] for item in room["members"]}

              room = await service.action(
                  room["id"], 8, "queue-all", room["revision"], "settings", {"queue_all": True}
              )
              participant = await service.join(room["id"], user(9)) if False else await service.snapshot(room["id"], 7)
              queued = await service.action(
                  room["id"], 7, "allowed", participant["revision"], "queue_add", {"query": "Allowed"}
              )
              assert queued["playback"]
              with pytest.raises(RoomError, match="restricted"):
                  await service.action(
                      room["id"], 7, "pause-denied", queued["revision"], "pause", {}
                  )


          @pytest.mark.asyncio
          async def test_recovering_group_is_readable_but_actions_retry(tmp_path):
              service = RoomService(
                  tmp_path / "rooms.db",
                  authority=lambda uid, chat: True,
                  member=lambda uid, chat: True,
              )
              room = await service.ensure_group(100, 1, 7)
              await service.set_recovering(100, "voice restart")
              recovering = await service.snapshot(room["id"], 7)
              assert recovering["state"] == "recovering"
              with pytest.raises(RoomError) as error:
                  await service.action(
                      room["id"], 7, "blocked", recovering["revision"], "close", {}
                  )
              assert error.value.status == 409
              assert error.value.code == "room_recovering"


          @pytest.mark.asyncio
          async def test_group_playback_timeout_is_retryable_without_success_record(tmp_path):
              calls = 0

              async def playback(chat_id, action, payload):
                  nonlocal calls
                  calls += 1
                  if calls == 1:
                      await __import__("asyncio").sleep(1)
                  return {
                      "track": payload["track"],
                      "status": "playing",
                      "position_seconds": 0,
                      "queue": [],
                  }

              service = RoomService(
                  tmp_path / "rooms.db",
                  playback=playback,
                  authority=lambda uid, chat: True,
                  member=lambda uid, chat: True,
                  search=search,
              )
              service.playback_timeout = 0.01
              room = await service.ensure_group(100, 1, 7)
              with pytest.raises(RoomError) as error:
                  await service.action(
                      room["id"], 7, "play", room["revision"], "force_play", {"query": "One"}
                  )
              assert error.value.code == "playback_timeout"
              assert (await service.snapshot(room["id"], 7))["revision"] == room["revision"]
              result = await service.action(
                  room["id"], 7, "play", room["revision"], "force_play", {"query": "One"}
              )
              assert calls == 2
              assert result["playback"]["track"]["title"] == "One"


          @pytest.mark.asyncio
          async def test_group_close_during_playback_does_not_commit_success(tmp_path):
              service = None

              async def playback(chat_id, action, payload):
                  with service._connect() as db:
                      db.execute(
                          "UPDATE rooms SET state='ended',end_reason='call_ended',revision=revision+1 "
                          "WHERE chat_id=?",
                          (chat_id,),
                      )
                  return {
                      "track": payload["track"],
                      "status": "playing",
                      "position_seconds": 0,
                      "queue": [],
                  }

              service = RoomService(
                  tmp_path / "rooms.db",
                  playback=playback,
                  authority=lambda uid, chat: True,
                  member=lambda uid, chat: True,
                  search=search,
              )
              room = await service.ensure_group(100, 1, 7)
              with pytest.raises(RoomError, match="ended"):
                  await service.action(
                      room["id"], 7, "play", room["revision"], "force_play", {"query": "One"}
                  )
              with service._connect() as db:
                  count = db.execute(
                      "SELECT count(*) FROM room_actions WHERE room_id=? AND action_id='play'",
                      (room["id"],),
                  ).fetchone()[0]
              assert count == 0
          '''
          tests.write_text(body)
          PY
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Verify
        run: |
          ruff format src/parlay/rooms/service.py tests/test_rooms_service.py
          ruff check src/parlay/rooms/service.py tests/test_rooms_service.py
          pytest -q tests/test_rooms_service.py
          mypy src/parlay/rooms/service.py
      - name: Commit verified fix
        run: |
          git config user.name 'software-factory-agent'
          git config user.email 'software-factory-agent@users.noreply.github.com'
          git add src/parlay/rooms/service.py tests/test_rooms_service.py
          git commit -m 'fix(rooms): enforce live group authority and bounded playback'
          git push origin main
      - name: Remove temporary workflow
        if: always()
        run: |
          git pull --rebase origin main || true
          git rm -f .github/workflows/tmp-rooms-integrated-audit-20260910.yml
          git commit -m 'ci: remove temporary rooms audit verification' || true
          git push origin main || true
