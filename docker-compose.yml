services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: parlay-pot-provider
    restart: unless-stopped
    ports:
      - "127.0.0.1:4416:4416"
  parlay:
    build: .
    container_name: parlay-bot
    restart: unless-stopped
    depends_on:
      - pot-provider
    env_file:
      - .env
    environment:
      POT_PROVIDER_URL: http://pot-provider:4416
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8080
    ports:
      # Terminate public HTTPS/WSS at a reverse proxy on the host.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    working_dir: /app
